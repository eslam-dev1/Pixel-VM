name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # The project signs the debug build with ${rootDir}/debug.keystore, but that file is in .gitignore.
    # Generate it in CI so assembleDebug does not fail with "Keystore file not found".
    - name: Generate debug.keystore
      run: |
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android -keypass android \
          -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    # compileSdk is 36.1, which is not always preinstalled on the runner.
    - name: Accept licenses and install Android SDK packages
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
        if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(which sdkmanager); fi
        echo "Using sdkmanager at: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

    - name: Assemble Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: app/build/reports/tests/testDebugUnitTest/
        if-no-files-found: ignore

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: pixel-sim-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
